# Reference pipeline. Projects typically run the same steps from build/ci.sh in their own CI (Jenkins, GitLab, …); the script is the
# source of truth, this file only shows the environment it expects (Linux, Docker available, .NET 10 SDK).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: All gates
        run: bash ./build/ci.sh

      - name: Publish artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            artifacts/test-results/*.trx
            artifacts/licences.md
            artifacts/vulnerable.txt
